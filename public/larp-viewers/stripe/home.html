<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<title>Home – Stripe</title>
<link rel="icon" href="/larplabslogo.png">
<style>:root{--e:cubic-bezier(.3,0,.2,1);--nav:240px;--ast:345px;--mono:"Source Code Pro",Menlo,Consolas,monospace}
body.lt{--bg:#fff;--sub:#f6f8fa;--sub2:#f4f7fa;--line:#ebeef1;--line2:#d4dee9;--tx:#1a2c44;--tx-h:#30313d;--tx-v:#414552;--tx2:#667691;--tx3:#95a4ba;--ac:#533afd;--ac2:#625afa;--ac-h:#4434d4;--ac-bg:#f5f4ff;--btn:#273951;--chart:#635bff;--prev:#b6c0cd;--grid:#ebeef1;--hover:#f6f8fa;--sel:#f5f4ff;--menu:#fff;--shadow:0 7px 14px rgba(50,50,93,.1),0 3px 6px rgba(0,0,0,.07),0 0 0 1px rgba(50,50,93,.05);--scrim:rgba(26,44,68,.36);
  --ok-bg:#eafcdd;--ok-bd:#a8f170;--ok-tx:#217005;--bad-bg:#fef4f6;--bad-bd:#fbd3dc;--bad-tx:#c0123c;--info-bg:#e2fbfe;--info-bd:#a7e7fc;--info-tx:#045ad0;--warn-bg:#fef9da;--warn-bd:#fcedb9;--warn-tx:#a14800;--nt-bg:#ebeef1;--nt-bd:#d4dee9;--nt-tx:#545969;
  --c-ok:#9966ff;--c-unc:#7a73ff;--c-ref:#ffb800;--c-blk:#6e7f99;--c-fail:#b3063d;--c-inc:#c4b8ff;--c-res:#d4dee9;--toast:#1a2c44;--toast-tx:#fff}
body.dk{--bg:#14171d;--sub:#1b1e25;--sub2:#191c23;--line:#2b3039;--line2:#373d48;--tx:#c9ced8;--tx-h:#e3e7ee;--tx-v:#d7dce4;--tx2:#8c99ad;--tx3:#6c788b;--ac:#9289fe;--ac2:#9289fe;--ac-h:#a9a2ff;--ac-bg:#232044;--btn:#c9ced8;--chart:#8a83ff;--prev:#4f5868;--grid:#252a33;--hover:#1b1e25;--sel:#211e3d;--menu:#1f232b;--shadow:0 7px 18px rgba(0,0,0,.45),0 0 0 1px #2b3039;--scrim:rgba(0,0,0,.55);
  --ok-bg:#152207;--ok-bd:#28451a;--ok-tx:#3eae20;--bad-bg:#420320;--bad-bd:#6b0f33;--bad-tx:#f46b7d;--info-bg:#051a4c;--info-bd:#0c3375;--info-tx:#2b9df6;--warn-bg:#3a2400;--warn-bd:#5c3a07;--warn-tx:#f5a623;--nt-bg:#1b1e25;--nt-bd:#373d48;--nt-tx:#8c99ad;
  --c-ok:#8a83ff;--c-unc:#6a63e8;--c-ref:#d99a00;--c-blk:#6c788b;--c-fail:#f46b7d;--c-inc:#4b4590;--c-res:#373d48;--toast:#e3e7ee;--toast-tx:#14171d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Ubuntu,sans-serif;-webkit-font-smoothing:antialiased;min-width:960px}
a{color:var(--ac);text-decoration:none;cursor:pointer}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.ic{width:16px;height:16px;flex:none;display:block}
.fl{flex:1}
.mut{color:var(--tx2)}
.sm{font-size:12px;line-height:16px}
.mono{font-family:var(--mono);font-size:13px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.r{text-align:right;justify-content:flex-end}
.cc{color:var(--tx2);font-weight:400;font-size:14px}
.cc.big{font-size:20px;font-weight:400}
#app{opacity:0}
#app.ready{opacity:1;transition:opacity .15s}
/* ── Sidebar ─────────────────────────────────────────── */
#nav{position:fixed;left:0;top:0;bottom:48px;width:var(--nav);border-right:1px solid var(--line);background:var(--bg);padding:12px 14px 24px;overflow-y:auto;z-index:20;scrollbar-width:thin}
.acct{display:flex;align-items:center;gap:8px;width:100%;height:36px;border:0;background:none;border-radius:8px;padding:0 6px;text-align:left}
.acct:hover,.acct.open{background:var(--hover)}
.acct-av{width:24px;height:24px;border-radius:4px;background:var(--sub2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:none;box-shadow:inset 0 0 0 1px var(--line)}
.acct-av.lg{width:36px;height:36px;font-size:16px;border-radius:6px}
.acct-n{font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct-c{width:12px;height:12px;color:var(--tx2)}
.nv{display:flex;flex-direction:column;gap:0;margin-top:2px}
#nav>.nv:first-of-type{margin-top:30px}
.ni{display:flex;align-items:center;gap:12px;height:30px;padding:0 8px;margin:0 -2px;border-radius:6px;color:var(--tx);border:0;background:none;width:calc(100% + 4px);text-align:left;font-size:14px;line-height:20px}
.ni .ic{color:var(--tx2)}
.ni:hover{background:var(--hover)}
.ni.on{color:var(--ac);font-weight:600}
.ni.on .ic{color:var(--ac)}
.ni span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni.grp .gc{margin-left:auto;width:12px;height:12px;transition:transform .2s var(--e)}
.ni.grp.open .gc{transform:rotate(180deg)}
.ni.sb{padding-left:36px;height:28px;color:var(--tx2)}
.ni.sb:hover{color:var(--tx)}
.nv-h{font-size:12px;line-height:16px;color:var(--tx2);margin:22px 8px 6px;font-weight:500}
.sub[hidden]{display:none}
/* ── Top bar ─────────────────────────────────────────── */
#top{position:fixed;top:0;left:var(--nav);right:0;height:60px;background:var(--bg);display:flex;align-items:center;padding:0 40px;z-index:15;transition:right .25s var(--e)}
.top-in{display:flex;align-items:center;gap:8px;width:100%;max-width:1280px;margin:0 auto}
body.as-open #top{right:var(--ast)}
.srch{position:relative;width:360px;height:32px;display:flex;align-items:center;border-radius:6px;background:var(--sub);box-shadow:inset 0 0 0 1px transparent;transition:box-shadow .15s,background .15s}
.srch.foc{background:var(--bg);box-shadow:inset 0 0 0 1px var(--line2),0 0 0 4px rgba(83,58,253,.12)}
.s-ic{width:12px;height:12px;color:var(--tx2);margin:0 10px 0 14px}
.srch input{flex:1;height:32px;border:0;background:transparent;outline:none;min-width:0}
.srch input::placeholder{color:var(--tx2)}
.srch kbd{font:500 11px/16px var(--mono);color:var(--tx2);border:1px solid var(--line2);border-radius:4px;padding:0 5px;margin-right:10px}
.srch.foc kbd{display:none}
.s-dd{position:absolute;top:42px;left:0;width:480px;background:var(--menu);border-radius:8px;box-shadow:var(--shadow);padding:6px 0;display:none;max-height:70vh;overflow:auto;z-index:50}
.srch.dd .s-dd{display:block}
.sd-h{font-size:12px;color:var(--tx2);padding:8px 14px 4px;font-weight:500}
.sd-r{display:flex;align-items:center;gap:10px;padding:7px 14px;color:var(--tx)}
.sd-r:hover{background:var(--hover)}
.sd-r .ic{color:var(--tx2)}
.sd-r span:first-of-type{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sd-m{font-size:12px;color:var(--tx2);white-space:nowrap}
.sd-e{padding:12px 14px;color:var(--tx2)}
.sd-ask{display:flex;align-items:center;gap:10px;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:10px 14px;margin-top:6px;text-align:left;color:var(--tx)}
.sd-ask:hover{background:var(--hover)}
.tb{width:32px;height:32px;border:0;background:none;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--tx2);position:relative}
.tb:hover,.tb.open{background:var(--hover);color:var(--tx)}
.tb .ic{width:16px;height:16px}
.tb .dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 2px var(--bg)}
.tb.plus{background:var(--ac);color:#fff;border-radius:50%;width:24px;height:24px;margin-left:8px}
.tb.plus .ic{width:12px;height:12px}
.tb.plus:hover{background:var(--ac-h);color:#fff}
.tb.ast .ic{width:18px;height:18px}
/* ── Main ────────────────────────────────────────────── */
#main{margin-left:var(--nav);padding:60px 40px 96px;transition:margin .25s var(--e)}
body.as-open #main{margin-right:var(--ast)}
.pg{max-width:1280px;margin:0 auto}
.h1row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.h1row .btn{margin-bottom:4px}
.h1{font-size:28px;line-height:36px;font-weight:700;color:var(--tx-h);margin:23px 0 0;letter-spacing:-.2px}
.h1.ov{margin-top:46px}
.h2{font-size:20px;line-height:28px;font-weight:700;color:var(--tx-h);margin:40px 0 16px}
.hr{height:1px;background:var(--line2);margin:15px 0 0}
.ph{display:flex;align-items:center;gap:8px;padding:16px 0 12px}
.ph h1{font-size:28px;line-height:36px;font-weight:700;color:var(--tx-h);margin:0}
.ph-l{display:flex;flex-direction:column;gap:2px}
/* buttons */
.btn{height:28px;border-radius:6px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;border:0;font-weight:600;font-size:14px;line-height:20px;white-space:nowrap;flex:none;transition:background .15s,box-shadow .15s}
.btn .ic{width:12px;height:12px}
.btn.pri{background:var(--ac);color:#fff;box-shadow:0 1px 1px rgba(0,0,0,.08),inset 0 -1px 0 rgba(0,0,0,.12)}
.btn.pri:hover{background:var(--ac-h)}
.btn.sec{background:var(--bg);color:var(--btn);box-shadow:0 0 0 1px var(--line2),0 1px 1px rgba(0,0,0,.04)}
.btn.sec:hover{box-shadow:0 0 0 1px var(--tx3),0 1px 1px rgba(0,0,0,.04)}
.btn.sm{height:24px;font-size:12px;padding:0 8px}
.btn.icon{padding:0 8px}
.btn[disabled]{opacity:.45;pointer-events:none}
.ibx{width:28px;height:28px;border:0;background:none;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--tx2);flex:none}
.ibx:hover,.ibx.on{background:var(--hover);color:var(--tx)}
.ibx .ic{width:12px;height:12px}
.ii{display:inline-flex;color:var(--tx3);vertical-align:middle;cursor:help}
.ii .ic{width:12px;height:12px}
/* status pills */
.pil{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:16px;padding:1px 6px;border-radius:4px;border:1px solid;white-space:nowrap;font-weight:500}
.pil .pi{width:10px;height:10px}
.pil.ok{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok-tx)}
.pil.bad{background:var(--bad-bg);border-color:var(--bad-bd);color:var(--bad-tx)}
.pil.info{background:var(--info-bg);border-color:var(--info-bd);color:var(--info-tx)}
.pil.warn{background:var(--warn-bg);border-color:var(--warn-bd);color:var(--warn-tx)}
.pil.nt{background:var(--nt-bg);border-color:var(--nt-bd);color:var(--nt-tx)}
.chg{font-size:12px;line-height:16px;font-weight:600;padding:0 5px;border-radius:4px;margin-left:8px}
.chg.ok{background:var(--ok-bg);color:var(--ok-tx)}
.chg.bad{background:var(--bad-bg);color:var(--bad-tx)}
.chg.nt{background:var(--nt-bg);color:var(--nt-tx)}
.pm{display:inline-flex;width:24px;height:16px;border-radius:3px;overflow:hidden;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.06);align-items:center;justify-content:center;background:var(--sub)}
.pm .ic{width:24px;height:24px}
.pm.lg{width:36px;height:24px}
.pm.lg .ic{width:36px;height:36px}
.pmc{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.flg{width:16px;height:16px;display:inline-block;vertical-align:-3px}
/* ── Home ────────────────────────────────────────────── */
.today{display:grid;grid-template-columns:minmax(0,1fr) 355px;gap:35px;margin-top:32px}
.tsel{display:flex;gap:96px}
.mdd{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:0;font-size:14px;color:var(--tx);border-radius:4px}
.mdd .ic{width:12px;height:12px;color:var(--tx2)}
.mdd:hover span{color:var(--ac)}
.tv{font-size:20px;line-height:28px;color:var(--tx-v);margin-top:4px;font-variant-numeric:tabular-nums}
.tv.bump{animation:bump 1.2s}
@keyframes bump{0%{color:var(--ac)}100%{color:var(--tx-v)}}
.tt{font-size:12px;line-height:16px;color:var(--tx)}
.tv2{font-size:16px;line-height:24px;margin-top:8px;color:var(--tx)}
.tch{margin-top:12px;height:210px}
.bp{display:grid;grid-template-columns:1fr 1fr;gap:23px;margin-top:40px}
.bp-h{display:flex;justify-content:space-between;font-weight:500;color:var(--tx-v)}
.bp-h a{font-weight:500}
.bp-v{font-size:20px;line-height:28px;color:var(--tx-v);margin-top:6px;display:flex;align-items:center;gap:6px}
.bp-s{font-size:12px;line-height:16px;margin-top:4px}
.rec{position:relative;background:var(--sub);border:1px solid var(--line);border-radius:8px;padding:16px;overflow:hidden;min-height:274px}
.rec-c{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:16px;color:var(--tx2);background:var(--sub2);border:1px solid var(--line2);border-radius:4px;padding:1px 6px}
.rec-c .ic{width:12px;height:12px}
.rec .x{position:absolute;top:14px;right:14px;border:0;background:none;width:24px;height:24px;border-radius:6px;color:var(--tx2);display:flex;align-items:center;justify-content:center}
.rec .x:hover{background:var(--line)}
.rec .x .ic{width:12px;height:12px}
.rec h3{font-size:20px;line-height:24px;font-weight:700;color:var(--tx-v);margin:16px 0 8px}
.rec p{margin:0 0 16px;color:var(--tx-v)}
.rec a{display:inline-flex;align-items:center;gap:4px}
.rec a .ic{width:12px;height:12px}
.rec-art{position:absolute;left:0;right:0;bottom:0;height:76px;background:repeating-linear-gradient(-24deg,transparent 0 22px,rgba(99,91,255,.06) 22px 44px),linear-gradient(to top,var(--bg),transparent);clip-path:polygon(0 70%,100% 0,100% 100%,0 100%)}
.task{display:flex;align-items:center;gap:12px;background:var(--sub2);border-radius:12px;padding:8px 8px 8px 24px;margin-top:32px;min-height:52px}
.task>.ic{color:var(--tx2)}
.task .x{border:0;background:none;width:28px;height:28px;border-radius:6px;color:var(--tx2);display:flex;align-items:center;justify-content:center}
.task .x .ic{width:12px;height:12px}
.nchip{font-size:12px;line-height:16px;background:var(--info-bg);border:1px solid var(--info-bd);color:var(--info-tx);border-radius:4px;padding:1px 6px}
.ovf{display:flex;align-items:center;gap:8px;min-height:61px;border-bottom:1px solid var(--line2);flex-wrap:wrap;padding:8px 0}
.fp{display:inline-flex;align-items:center;gap:6px;height:24px;border-radius:12px;padding:0 10px;border:1px solid var(--line2);background:var(--bg);font-size:12px;line-height:16px;font-weight:600;color:var(--ac)}
.fp b{color:var(--tx);font-weight:600;padding-right:6px;border-right:1px solid var(--line2)}
.fp .ic{width:10px;height:10px;color:var(--tx2)}
.fp.dash{border-style:dashed;color:var(--tx)}
.fp.dash b{border:0;padding:0}
.fp:hover{background:var(--hover)}
.wg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;background:var(--sub2);border-radius:12px;padding:8px;margin-top:8px}
.wt{background:var(--bg);border-radius:6px;padding:16px 20px;display:flex;flex-direction:column;min-height:404px;box-shadow:0 0 0 1px var(--line)}
body.lt .wt{box-shadow:none}
.wt-h{display:flex;align-items:center;gap:2px;min-height:28px}
.wt-t{font-weight:600;color:var(--tx-h)}
.wv{display:flex;align-items:baseline;gap:10px;margin-top:2px}
.wv b{font-size:20px;line-height:28px;font-weight:700;color:var(--tx-v);font-variant-numeric:tabular-nums}
.pv{color:var(--tx2);font-size:14px;line-height:20px;margin-top:2px}
.wc{margin-top:14px;flex:1;min-height:240px}
.wf{display:flex;justify-content:space-between;align-items:center;font-size:12px;line-height:16px;color:var(--tx2);margin-top:auto;padding-top:12px}
.wf a{color:var(--tx2)}
.wf a:hover{color:var(--ac)}
.stk{display:flex;height:16px;border-radius:4px;overflow:hidden;margin:14px 0 18px;gap:2px}
.stk i{display:block;height:100%;min-width:3px;transition:filter .15s}
.stk i:hover{filter:brightness(1.1)}
.mix .mx{display:flex;align-items:center;gap:12px;height:49px;border-top:1px solid var(--line)}
.mix .mx:last-child{border-bottom:1px solid var(--line)}
.mix .mx i{width:8px;height:8px;border-radius:2px;flex:none}
.mix .mx span{flex:1}
.mix .mx b{font-weight:600}
.fl-l{display:flex;flex-direction:column;margin-top:8px}
.flr{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);color:var(--tx)}
.flr:hover{background:var(--hover)}
.flr>div{display:flex;flex-direction:column;min-width:0}
.flr .fr{align-items:flex-end;text-align:right}
.flr .mut{font-size:12px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flr .dr{color:var(--tx);font-size:12px;line-height:16px}
.nodata{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;flex:1;color:var(--tx2)}
.nodata .ic{width:20px;height:20px;color:var(--ok-tx)}
.tc{display:flex;flex-direction:column;margin-top:10px}
.tcr{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:63px;border-top:1px solid var(--line);color:var(--tx)}
.tcr:last-child{border-bottom:1px solid var(--line)}
.tcr:hover{background:var(--hover)}
.tcr>div{display:flex;flex-direction:column;min-width:0}
.tcr>div span{font-size:12px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcr b{font-weight:600}
/* charts */
.chart{position:relative}
.lc{display:block;overflow:visible}
.lc text{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;fill:var(--tx3)}
.lc .xl{fill:var(--tx2)}
.lc .gl{stroke:var(--grid);stroke-width:1}
.lc .gl.z{stroke:var(--line2)}
.lc .ln{fill:none;stroke:var(--chart);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.lc .pl{fill:none;stroke:var(--prev);stroke-width:2;stroke-dasharray:1 5;stroke-linecap:round}
.lc .ed{fill:var(--chart);stroke:var(--bg);stroke-width:2}
.lc .xh{stroke:var(--line2);stroke-width:1;opacity:0;pointer-events:none}
.lc .hd{fill:var(--chart);stroke:var(--bg);stroke-width:2;pointer-events:none}
.lc .hd2{fill:var(--prev);stroke:var(--bg);stroke-width:2;pointer-events:none}
.lc .cap{fill:transparent;cursor:default}
.ctip{position:absolute;display:none;pointer-events:none;background:var(--menu);border-radius:6px;padding:8px 10px;box-shadow:var(--shadow);font-size:12px;line-height:18px;z-index:5;white-space:nowrap;min-width:160px}
.tt-h{color:var(--tx2);margin-bottom:2px}
.tt-r{display:flex;align-items:center;gap:8px}
.tt-r span{flex:1;color:var(--tx2)}
.tt-r b{font-weight:600;color:var(--tx)}
.sw{width:10px;height:2px;border-radius:1px;display:inline-block;flex:none}
.sw.cur{background:var(--chart)}
.sw.prv{background:var(--prev)}
/* ── Tables ──────────────────────────────────────────── */
.tabs{display:flex;gap:24px;position:relative;border-bottom:1px solid var(--line2);margin-top:4px}
.tab{border:0;background:none;padding:8px 0 9px;font-weight:600;color:var(--tx)}
.tab.on,.tab:hover{color:var(--ac)}
.ink{position:absolute;bottom:-1px;left:0;height:2px;background:var(--ac);transition:transform .25s var(--e),width .25s var(--e)}
.stabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:24px 0 16px}
.stab{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:11px;border-radius:8px;border:0;background:var(--bg);box-shadow:0 0 0 1px var(--line2);text-align:left}
.stab:hover{box-shadow:0 0 0 1px var(--tx3)}
.stab b{font-size:16px;line-height:20px;font-weight:700}
.stab.on{box-shadow:0 0 0 2px var(--ac);color:var(--ac)}
.stab.on span{font-weight:600}
.fbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 0 12px}

    step("<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9\"/><path d=\"M13.73 21a2 2 0 0 1-3.46 0\"/></svg>","Tap Turn on","");
    p.textContent="Install "+appName;
    n.textContent="Turn on here instead";
    // No snooze here: the same "later" key would also suppress the turn-on
    // sheet inside the installed app, which this user will need soon.
    n.onclick=function(){close();setTimeout(function(){sheet("turnon")},480)};
    // The floating pill (lib/larp-install-prompt.ts) owns the captured
    // beforeinstallprompt; this button asks it to fire the native sheet,
    // and ll-install-choice/appinstalled report back.
    var onChoice=function(c){
      var o=c&&c.detail&&c.detail.outcome;
      if(o==="accepted")return; // appinstalled takes over from here
      p.disabled=false;p.textContent="Install "+appName;
      s.textContent="The install was cancelled. Try again whenever you want.";
    };
    window.addEventListener("ll-install-choice",onChoice);
    sheetCleanup=function(){window.removeEventListener("ll-install-choice",onChoice)};
    onPrimary=function(){
      p.disabled=true;p.textContent="Installing…";
      var req=null;
      try{req=new CustomEvent("ll-install-request",{cancelable:true})}catch(e){}
      if(!req){p.disabled=false;p.textContent="Install "+appName;return}
      window.dispatchEvent(req);
      if(req.defaultPrevented)return;
      p.disabled=false;p.textContent="OK";
      s.textContent="Chrome didn't offer an install here. Use the browser menu (⋮), then Install app or Add to Home screen. Already installed? Open "+appName+" from your home screen and tap Turn on.";
    };
  }else if(mode==="installdone"){
    t.textContent=appName+" added";
    s.textContent="One last step: open it from your home screen and tap Turn on. Notifications will come from the app.";
    step(a.icon||"","Open "+appName+" from your home screen","");
    step("<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9\"/><path d=\"M13.73 21a2 2 0 0 1-3.46 0\"/></svg>","Tap Turn on","");
    p.textContent="Got it";n.style.display="none";
  }else{
    t.textContent=mode==="old"?"Update your iPhone":"Reinstall "+appName+" to get notifications";
    s.textContent=mode==="old"
      ?"Notifications need iOS 16.4 or later. Go to Settings, then General, then Software Update."
      :"This copy of the app can't get notifications. Delete it from your Home Screen, scan the QR code on your dashboard again, then tap Share and Add to Home Screen in Safari.";
    p.textContent="OK";n.style.display="none";
    onPrimary=function(){snooze();close()};
  }
  p.onclick=function(){onPrimary()};
  // A stray tap outside just closes it; only "Not now" hides it for a day.
  root.querySelector(".bd").onclick=function(){if(mode!=="add")close()};
  sheetHost=host;sheetMode=mode;sheetCleanup=null;
  document.documentElement.appendChild(host);
  requestAnimationFrame(function(){requestAnimationFrame(function(){w.classList.add("on")})});
}
})();
</script>
<script id="ll-install-data" type="application/json">{"name":"Stripe","shortName":"Stripe","bg":"#111111","iconUrl":"/api/pwa/stripe/icon?size=120","sw":true}</script>
<script>
(function(){
  if(!("serviceWorker" in navigator))return;
  if(!window.addEventListener)return;
  if(window.__llInstallBubble)return;
  window.__llInstallBubble=true;
  var D=document.getElementById("ll-install-data");
  var data=D?JSON.parse(D.textContent||"{}"):{};
  var ev=null, btn=null, dismissed=false;
  try{ dismissed = sessionStorage.getItem("ll-install-dismissed")==="1"; }catch(e){}

  // Register /sw.js so Chrome treats the larp as installable. Idempotent —
  // a no-op when the notifications shim (or a prior visit) already registered
  // it. Never rejects (no install prompt if the SW can't register).
  if(data.sw!==false) navigator.serviceWorker.register("/sw.js").catch(function(){});

  function hide(){ if(btn){btn.remove();} btn=null; }

  function show(){
    if(btn || dismissed)return;
    var b=document.createElement("button");
    b.id="ll-install-btn";
    b.type="button";
    b.setAttribute("aria-label","Install "+data.name);
    // Inline styles + a sentinel class so the scraped template's CSS can't
    // quietly reshape it. !important on the layout-critical props.
    b.style.cssText=[
      "position:fixed",
      "right:16px",
      "bottom:16px",
      "z-index:2147483000",
      "display:inline-flex",
      "align-items:center",
      "gap:8px",
      "max-width:calc(100vw - 32px)",
      "padding:9px 14px 9px 9px",
      "border:0",
      "border-radius:999px",
      "background:"+(data.bg||"#111111"),
      "color:#fff",
      "font:600 13px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif",
      "letter-spacing:.01em",
      "box-shadow:0 6px 20px rgba(0,0,0,.28),0 1px 3px rgba(0,0,0,.2)",
      "cursor:pointer",
      "opacity:0",
      "transform:translateY(6px)",
      "transition:opacity .18s ease,transform .18s ease",
      "-webkit-tap-highlight-color:transparent"
    ].join(";")+"!important";
    var img=document.createElement("img");
    img.src=data.iconUrl; img.alt=""; img.width=22; img.height=22;
    img.style.cssText="width:22px;height:22px;border-radius:6px;flex:0 0 auto;display:block";
    var label=document.createElement("span");
    label.textContent="Install "+(data.shortName||data.name);
    label.style.cssText="white-space:nowrap;overflow:hidden;text-overflow:ellipsis";
    var x=document.createElement("span");
    x.textContent="×";
    x.setAttribute("role","button");
    x.setAttribute("aria-label","Dismiss");
    x.style.cssText="flex:0 0 auto;margin-left:2px;opacity:.6;font-size:15px;line-height:1;padding:0 2px";
    b.appendChild(img); b.appendChild(label); b.appendChild(x);
    b.addEventListener("click",function(e){
      if(e.target===x){ dismiss(); return; }
      if(!ev)return;
      ev.prompt();
      var choice=ev.userChoice;
      if(choice&&choice.then){ choice.then(function(){ hide(); ev=null; }); }
      else { hide(); ev=null; }
    });
    document.body.appendChild(b);
    btn=b;
    // Animate in on the next frame.
    requestAnimationFrame(function(){
      b.style.opacity="1";
      b.style.transform="translateY(0)";
    });
  }

  function dismiss(){
    hide();
    dismissed=true;
    try{ sessionStorage.setItem("ll-install-dismissed","1"); }catch(e){}
  }

  window.addEventListener("beforeinstallprompt",function(e){
    e.preventDefault();
    ev=e;
    show();
  });

  // The notifications client's install sheet (lib/notifications/inject.ts)
  // can ask for the native prompt on demand: it dispatches a cancelable
  // "ll-install-request"; preventing default tells the sheet the button is
  // live, then we fire the same captured prompt a pill tap would. The
  // outcome goes back as "ll-install-choice" so the sheet can react to a
  // cancelled install.
  window.addEventListener("ll-install-request",function(e){
    if(!ev)return;
    e.preventDefault();
    ev.prompt();
    var choice=ev.userChoice;
    if(choice&&choice.then){
      choice.then(function(res){
        window.dispatchEvent(new CustomEvent("ll-install-choice",{detail:{outcome:res&&res.outcome}}));
        hide(); ev=null;
      },function(){ hide(); ev=null; });
    }else{ hide(); ev=null; }
  });
  window.addEventListener("appinstalled",function(){
    ev=null; hide();
    try{ sessionStorage.removeItem("ll-install-dismissed"); }catch(e){}
  });
})();
</script>
