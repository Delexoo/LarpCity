<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#000000"/>
<title>Messages</title>
<style>
:root{
  --bg:#000;
  --ink:#fff;
  --muted:rgba(235,235,245,.55);
  --muted2:rgba(235,235,245,.4);
  --recv:#262629;
  --sent:#0A84FF;
  --sent2:#0071E3;
  --glass:rgba(40,40,42,.52);
  --glass-strong:rgba(48,48,50,.62);
  --glass-stroke:rgba(255,255,255,.14);
  --glass-hi:rgba(255,255,255,.22);
  --field:rgba(28,28,30,.72);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --chrome-pad:calc(108px + var(--safe-t));
  --composer-h:calc(62px + var(--safe-b));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  height:100%;margin:0;background:#050505;color:var(--ink);overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
#phone{
  position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;max-width:100%;
  isolation:isolate;
}
@media(min-width:480px){
  #phone{
    width:390px;height:min(844px,calc(100% - 32px));left:50%;top:50%;right:auto;bottom:auto;
    transform:translate(-50%,-50%);border-radius:40px;overflow:hidden;
    box-shadow:0 30px 90px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.08);
  }
}

/* —— Liquid glass chrome (floats over thread) —— */
.chrome{
  position:absolute;left:0;right:0;top:0;z-index:20;pointer-events:none;
  padding:var(--safe-t) 14px 10px;
  background:
    linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.18) 55%, rgba(0,0,0,0) 100%);
}
.chrome::before{
  content:"";position:absolute;inset:0;bottom:auto;height:100%;
  backdrop-filter:saturate(160%) blur(28px);
  -webkit-backdrop-filter:saturate(160%) blur(28px);
  mask-image:linear-gradient(180deg,#000 0%,#000 62%,transparent 100%);
  -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 62%,transparent 100%);
  pointer-events:none;
}
.chrome > *{position:relative;z-index:1;pointer-events:auto}

.status{
  height:36px;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 8px 4px;font-size:16px;font-weight:600;letter-spacing:-.02em;color:#fff;
}
.status .icons{display:flex;align-items:center;gap:7px;padding-bottom:2px;color:#fff}
.status .bat{
  display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;letter-spacing:-.01em;
}
.status .bat svg{display:block}

.nav{
  margin-top:2px;display:grid;grid-template-columns:52px 1fr 52px;align-items:center;gap:4px;
  min-height:72px;
}
.glass-btn{
  width:40px;height:40px;border-radius:50%;border:0;padding:0;cursor:pointer;
  display:grid;place-items:center;color:#fff;position:relative;
  background:
    linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.04)),
    var(--glass);
  box-shadow:
    inset 0 0.5px 0 var(--glass-hi),
    inset 0 0 0 0.5px var(--glass-stroke),
    0 8px 24px rgba(0,0,0,.35);
  backdrop-filter:saturate(180%) blur(24px);
  -webkit-backdrop-filter:saturate(180%) blur(24px);
}
.glass-btn svg{display:block}
.badge{
  position:absolute;left:22px;top:-5px;min-width:22px;height:18px;padding:0 5px;
  border-radius:10px;background:#FF3B30;color:#fff;font-size:11px;font-weight:700;
  display:grid;place-items:center;letter-spacing:-.02em;
  box-shadow:0 2px 8px rgba(255,59,48,.45);
}
.who{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0}
.av{
  width:52px;height:52px;border-radius:50%;display:grid;place-items:center;
  color:#fff;font-size:20px;font-weight:600;overflow:hidden;
  box-shadow:0 6px 18px rgba(0,0,0,.4), inset 0 0 0 0.5px rgba(255,255,255,.18);
}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.nm{
  font-size:12px;font-weight:500;color:rgba(255,255,255,.92);
  display:inline-flex;align-items:center;gap:2px;max-width:160px;
}
.nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm svg{width:6px;height:10px;opacity:.55;flex:none}

/* —— Thread —— */
.thread{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(var(--chrome-pad) + 4px) 12px calc(var(--composer-h) + 8px);
  display:flex;flex-direction:column;gap:2px;
  background:#000;
  scrollbar-width:none;
}
.thread::-webkit-scrollbar{display:none}
.ts{
  align-self:center;margin:14px 0 10px;font-size:12px;font-weight:500;
  color:var(--muted);letter-spacing:-.01em;
}
.row{display:flex;width:100%;margin:1px 0}
.row.sent{justify-content:flex-end}
.row.recv{justify-content:flex-start}
.bubble{
  max-width:78%;padding:8px 13px;font-size:17px;line-height:22px;letter-spacing:-.02em;
  word-wrap:break-word;white-space:pre-wrap;position:relative;
}
.row.recv .bubble{
  background:var(--recv);color:#fff;border-radius:20px;
  box-shadow:inset 0 0.5px 0 rgba(255,255,255,.06);
}
.row.sent .bubble{
  background:linear-gradient(180deg,var(--sent) 0%,var(--sent2) 100%);
  color:#fff;border-radius:20px;
  box-shadow:inset 0 0.5px 0 rgba(255,255,255,.22), 0 4px 14px rgba(10,132,255,.22);
}
.row.recv.first .bubble{border-bottom-left-radius:6px}
.row.recv.mid .bubble{border-top-left-radius:6px;border-bottom-left-radius:6px}
.row.recv.last .bubble{border-top-left-radius:6px}
.row.sent.first .bubble{border-bottom-right-radius:6px}
.row.sent.mid .bubble{border-top-right-radius:6px;border-bottom-right-radius:6px}
.row.sent.last .bubble{border-top-right-radius:6px}
.row.recv.solo .bubble,.row.sent.solo .bubble{border-radius:20px}
.row.recv.last .bubble::after,.row.recv.solo .bubble::after{
  content:"";position:absolute;left:-4px;bottom:0;width:14px;height:14px;
  background:radial-gradient(circle at 0 0,transparent 66%,var(--recv) 67%);
}
.row.sent.last .bubble::after,.row.sent.solo .bubble::after{
  content:"";position:absolute;right:-4px;bottom:0;width:14px;height:14px;
  background:radial-gradient(circle at 100% 0,transparent 66%,var(--sent2) 67%);
}
.meta{
  align-self:flex-end;padding:3px 10px 8px;font-size:11px;font-weight:500;color:var(--muted);
}
.typing{
  display:inline-flex;align-items:center;gap:4px;padding:13px 15px;
  background:var(--recv);border-radius:20px;border-bottom-left-radius:6px;margin:2px 0 4px;
  box-shadow:inset 0 0.5px 0 rgba(255,255,255,.06);
}
.typing i{
  width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55);opacity:.35;
  animation:blink 1.2s infinite ease-in-out;
}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.22;transform:translateY(0)}40%{opacity:.95;transform:translateY(-1px)}}

/* —— Floating liquid-glass composer —— */
.composer-wrap{
  position:absolute;left:0;right:0;bottom:0;z-index:20;
  padding:8px 12px calc(10px + var(--safe-b));
  pointer-events:none;
  background:linear-gradient(0deg, rgba(0,0,0,.72) 0%, rgba(0,0,0,.28) 55%, rgba(0,0,0,0) 100%);
}
.composer-wrap::before{
  content:"";position:absolute;inset:0;top:auto;height:100%;
  backdrop-filter:saturate(160%) blur(26px);
  -webkit-backdrop-filter:saturate(160%) blur(26px);
  mask-image:linear-gradient(0deg,#000 0%,#000 48%,transparent 100%);
  -webkit-mask-image:linear-gradient(0deg,#000 0%,#000 48%,transparent 100%);
  pointer-events:none;
}
.composer{
  position:relative;z-index:1;pointer-events:auto;
  display:flex;align-items:center;gap:10px;
}
.composer .plus{
  width:38px;height:38px;border-radius:50%;border:0;padding:0;flex:none;cursor:pointer;
  display:grid;place-items:center;color:rgba(255,255,255,.92);
  background:
    linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.04)),
    var(--glass-strong);
  box-shadow:
    inset 0 0.5px 0 var(--glass-hi),
    inset 0 0 0 0.5px var(--glass-stroke),
    0 10px 28px rgba(0,0,0,.4);
  backdrop-filter:saturate(180%) blur(22px);
  -webkit-backdrop-filter:saturate(180%) blur(22px);
}
.composer .field{
  flex:1;min-height:40px;border-radius:22px;padding:9px 42px 9px 16px;position:relative;
  display:flex;align-items:center;
  background:
    linear-gradient(180deg, rgba(255,255,255,.1), rgba(255,255,255,.03)),
    var(--field);
  box-shadow:
    inset 0 0.5px 0 rgba(255,255,255,.14),
    inset 0 0 0 0.5px rgba(255,255,255,.1),
    0 10px 30px rgba(0,0,0,.35);
  backdrop-filter:saturate(180%) blur(22px);
  -webkit-backdrop-filter:saturate(180%) blur(22px);
}
.composer .field span{color:var(--muted2);font-size:17px;letter-spacing:-.01em}
.composer .wave{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  width:22px;height:22px;color:rgba(255,255,255,.55);
}
.home{
  position:absolute;left:0;right:0;bottom:calc(4px + var(--safe-b) * 0);z-index:21;
  height:0;pointer-events:none;
}
.home i{
  position:absolute;left:50%;bottom:calc(6px + var(--safe-b) * 0.15);transform:translateX(-50%);
  width:126px;height:5px;border-radius:3px;background:rgba(255,255,255,.92);opacity:.9;
}

/* SMS green accents */
.sms .row.sent .bubble{
  background:linear-gradient(180deg,#34C759 0%,#248A3D 100%);
  box-shadow:inset 0 0.5px 0 rgba(255,255,255,.22), 0 4px 14px rgba(52,199,89,.2);
}
.sms .row.sent.last .bubble::after,.sms .row.sent.solo .bubble::after{
  background:radial-gradient(circle at 100% 0,transparent 66%,#248A3D 67%);
}
</style>
</head>
<body>
<div id="phone">
  <div class="chrome">
    <div class="status">
      <div class="time" id="statusTime">2:30</div>
      <div class="icons" aria-hidden="true">
        <svg width="19" height="12" viewBox="0 0 19 12" fill="currentColor"><rect x="0" y="4" width="3" height="8" rx="0.7"/><rect x="4.5" y="2.5" width="3" height="9.5" rx="0.7"/><rect x="9" y="1" width="3" height="11" rx="0.7"/><rect x="13.5" y="0" width="3" height="12" rx="0.7" opacity=".35"/></svg>
        <span style="font-size:12px;font-weight:600;letter-spacing:-.02em;margin:0 1px 1px">5G</span>
        <span class="bat">
          <span id="batteryPct">25</span>
          <svg width="27" height="12" viewBox="0 0 27 12"><rect x="0.6" y="1.2" width="21" height="9.6" rx="2.4" stroke="currentColor" stroke-width="1.2" fill="none" opacity=".5"/><rect x="2" y="2.6" width="6.5" height="6.8" rx="1" fill="currentColor"/><path d="M23.4 4.2h1.4a1.4 1.4 0 0 1 0 2.8h-1.4" fill="currentColor" opacity=".5"/></svg>
        </span>
      </div>
    </div>
    <header class="nav">
      <button class="glass-btn back" type="button" aria-label="Back" onclick="history.length>1&&history.back()">
        <svg width="11" height="18" viewBox="0 0 11 18" fill="none"><path d="M9.5 1.5 2 9l7.5 7.5" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="badge" id="unreadBadge" hidden>0</span>
      </button>
      <div class="who">
        <div class="av" id="avatar">JJ</div>
        <div class="nm">
          <span id="contactName">JJ</span>
          <svg viewBox="0 0 7 11" fill="none"><path d="M1 1l4.5 4.5L1 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>
      <button class="glass-btn" type="button" aria-label="FaceTime">
        <svg width="20" height="14" viewBox="0 0 20 14" fill="none"><rect x="0.75" y="1.25" width="12.5" height="11.5" rx="2.5" stroke="currentColor" stroke-width="1.5"/><path d="M14.2 5.2 18.8 2.6v8.8l-4.6-2.6V5.2z" fill="currentColor"/></svg>
      </button>
    </header>
  </div>

  <main class="thread" id="thread"></main>

  <div class="composer-wrap">
    <div class="composer">
      <button class="plus" type="button" aria-label="Apps">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 2.2v11.6M2.2 8h11.6" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg>
      </button>
      <div class="field">
        <span id="inputPh">iMessage</span>
        <svg class="wave" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 12v0M7.5 8.5v7M11 5.5v13M14.5 8.5v7M18 10v4" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
  </div>
  <div class="home" aria-hidden="true"><i></i></div>
</div>
<script id="payload" type="application/json">{}</script>
<script>
(function () {
  "use strict";
  var P = {};
  try { P = JSON.parse(document.getElementById("payload").textContent || "{}") || {}; } catch (e) { P = {}; }
  var contact = P.contact || {};
  var messages = Array.isArray(P.messages) ? P.messages : [];
  var name = contact.name || "JJ";
  var letters = String(contact.avatarLetters || name.charAt(0) || "?").slice(0, 2).toUpperCase();
  var top = contact.avatarHueA || "#7A7A80";
  var bot = contact.avatarHueB || "#3A3A3C";
  var avatarUrl = contact.avatarUrl || P.avatarUrl || "";
  var service = String(contact.service || "iMessage").toLowerCase() === "sms" ? "sms" : "imessage";
  var showTyping = P.showTyping !== false;
  var readLabel = P.readLabel || contact.readLabel || "Delivered";
  var showRead = P.showRead !== false;
  var statusTime = P.statusTime || contact.statusTime || "2:30";
  var battery = P.battery != null ? String(P.battery) : (contact.battery != null ? String(contact.battery) : "25");
  var unread = Number(P.unreadCount != null ? P.unreadCount : (contact.unreadCount != null ? contact.unreadCount : 271));

  document.title = name + " – Messages";
  document.getElementById("statusTime").textContent = statusTime;
  document.getElementById("batteryPct").textContent = battery;
  document.getElementById("contactName").textContent = name;
  document.getElementById("inputPh").textContent = service === "sms" ? "Text Message" : "iMessage";
  if (service === "sms") document.getElementById("phone").classList.add("sms");

  var badge = document.getElementById("unreadBadge");
  if (unread > 0) {
    badge.hidden = false;
    badge.textContent = unread > 999 ? "999+" : String(unread);
  }

  var av = document.getElementById("avatar");
  if (avatarUrl) {
    av.innerHTML = "";
    var img = document.createElement("img");
    img.src = avatarUrl;
    img.alt = "";
    img.onerror = function () {
      av.textContent = letters;
      av.style.background = "linear-gradient(180deg," + top + " 0%," + bot + " 100%)";
    };
    av.appendChild(img);
  } else {
    av.textContent = letters;
    av.style.background = "linear-gradient(180deg," + top + " 0%," + bot + " 100%)";
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }
  function sideOf(m) {
    return m.side === "sent" || m.side === "you" ? "sent" : "recv";
  }

  var items = messages.filter(function (m) { return m && m.kind !== "typing"; });
  var html = "";
  var lastSentIndex = -1;
  items.forEach(function (m, i) {
    if (m.timestampLabel) html += '<div class="ts">' + esc(m.timestampLabel) + "</div>";
    if (m.kind === "timestamp" || !m.text) return;
    var side = sideOf(m);
    var prev = items[i - 1];
    var next = items[i + 1];
    var prevSame = prev && prev.kind !== "timestamp" && prev.text && sideOf(prev) === side && !m.timestampLabel;
    if (m.timestampLabel) prevSame = false;
    var nextSame = next && next.kind !== "timestamp" && next.text && sideOf(next) === side && !next.timestampLabel;
    var role = !prevSame && !nextSame ? "solo" : !prevSame && nextSame ? "first" : prevSame && nextSame ? "mid" : "last";
    html += '<div class="row ' + side + " " + role + '"><div class="bubble">' + esc(m.text) + "</div></div>";
    if (side === "sent") lastSentIndex = i;
  });

  if (showRead && lastSentIndex >= 0) {
    var rebuilt = "";
    items.forEach(function (m, i) {
      if (m.timestampLabel) rebuilt += '<div class="ts">' + esc(m.timestampLabel) + "</div>";
      if (m.kind === "timestamp" || !m.text) return;
      var side = sideOf(m);
      var prev = items[i - 1];
      var next = items[i + 1];
      var prevSame = prev && prev.kind !== "timestamp" && prev.text && sideOf(prev) === side && !m.timestampLabel;
      if (m.timestampLabel) prevSame = false;
      var nextSame = next && next.kind !== "timestamp" && next.text && sideOf(next) === side && !next.timestampLabel;
      var role = !prevSame && !nextSame ? "solo" : !prevSame && nextSame ? "first" : prevSame && nextSame ? "mid" : "last";
      rebuilt += '<div class="row ' + side + " " + role + '"><div class="bubble">' + esc(m.text) + "</div></div>";
      if (i === lastSentIndex) rebuilt += '<div class="meta">' + esc(readLabel) + "</div>";
    });
    html = rebuilt;
  }

  if (showTyping) {
    html += '<div class="row recv"><div class="typing" aria-label="Typing"><i></i><i></i><i></i></div></div>';
  }
  var thread = document.getElementById("thread");
  thread.innerHTML = html;
  requestAnimationFrame(function () { thread.scrollTop = thread.scrollHeight; });
})();
</script>
</body>
</html>
