<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#ffffff"/>
<title>Messages</title>
<style>
:root{
  --bg:#fff;--ink:#000;--muted:#8e8e93;--hair:#e5e5ea;--recv:#e9e9eb;--sent:#007AFF;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --status:44px;--nav:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#0b1220;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);overflow:hidden}
#phone{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;max-width:100%}
@media(min-width:480px){
  #phone{width:390px;height:min(844px,calc(100% - 32px));left:50%;top:50%;right:auto;bottom:auto;
    transform:translate(-50%,-50%);border-radius:36px;overflow:hidden;
    box-shadow:0 24px 80px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.06)}
}
.status{height:calc(var(--status) + var(--safe-t));padding:var(--safe-t) 22px 0;display:flex;align-items:flex-end;justify-content:space-between;font-size:15px;font-weight:600;flex:none;background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px)}
.status .time{padding-bottom:6px}
.status .icons{display:flex;align-items:center;gap:6px;padding-bottom:8px;color:#111}
.nav{height:var(--nav);display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:0 6px 4px;flex:none;border-bottom:0.5px solid rgba(0,0,0,.08);background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px)}
.nav .back{width:44px;height:44px;border:0;background:transparent;color:var(--sent);display:grid;place-items:center;cursor:pointer}
.nav .who{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0}
.nav .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:17px;font-weight:600}
.nav .nm{font-size:11px;font-weight:500;color:#000;display:inline-flex;align-items:center;gap:2px}
.nav .nm svg{width:7px;height:11px;opacity:.45}
.thread{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 8px;display:flex;flex-direction:column;gap:2px}
.ts{align-self:center;margin:10px 0 8px;font-size:11px;font-weight:500;color:var(--muted)}
.row{display:flex;width:100%;margin:1px 0}
.row.sent{justify-content:flex-end}
.row.recv{justify-content:flex-start}
.bubble{max-width:78%;padding:8px 12px;font-size:17px;line-height:22px;letter-spacing:-.01em;word-wrap:break-word;white-space:pre-wrap;position:relative}
.row.recv .bubble{background:var(--recv);color:#000;border-radius:18px}
.row.sent .bubble{background:var(--sent);color:#fff;border-radius:18px}
.row.recv.first .bubble{border-bottom-left-radius:6px}
.row.recv.mid .bubble{border-top-left-radius:6px;border-bottom-left-radius:6px}
.row.recv.last .bubble{border-top-left-radius:6px}
.row.sent.first .bubble{border-bottom-right-radius:6px}
.row.sent.mid .bubble{border-top-right-radius:6px;border-bottom-right-radius:6px}
.row.sent.last .bubble{border-top-right-radius:6px}
.row.recv.solo .bubble,.row.sent.solo .bubble{border-radius:18px}
.row.recv.last .bubble::after,.row.recv.solo .bubble::after{
  content:"";position:absolute;left:-5px;bottom:0;width:16px;height:16px;
  background:radial-gradient(circle at 0 0,transparent 67%,var(--recv) 68%)}
.row.sent.last .bubble::after,.row.sent.solo .bubble::after{
  content:"";position:absolute;right:-5px;bottom:0;width:16px;height:16px;
  background:radial-gradient(circle at 100% 0,transparent 67%,var(--sent) 68%)}
.meta{align-self:flex-end;padding:2px 10px 6px;font-size:11px;font-weight:500;color:var(--muted)}
.typing{display:inline-flex;align-items:center;gap:4px;padding:12px 14px;background:var(--recv);border-radius:18px;border-bottom-left-radius:6px;margin:2px 0 4px}
.typing i{width:7px;height:7px;border-radius:50%;background:#999;opacity:.45;animation:blink 1.2s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.28;transform:translateY(0)}40%{opacity:.9;transform:translateY(-1px)}}
.composer{flex:none;padding:6px 10px calc(8px + var(--safe-b));display:flex;align-items:flex-end;gap:8px;background:rgba(255,255,255,.94);border-top:0.5px solid rgba(0,0,0,.08);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.composer .plus{width:32px;height:32px;border-radius:50%;border:0;background:var(--sent);color:#fff;display:grid;place-items:center;flex:none;margin-bottom:2px}
.composer .field{flex:1;min-height:36px;border:1px solid var(--hair);border-radius:20px;padding:8px 40px 8px 14px;position:relative;background:#fff;display:flex;align-items:center}
.composer .field span{color:var(--muted);font-size:17px}
.composer .mic{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:#8e8e93;width:20px;height:20px}
.home{height:calc(10px + var(--safe-b));flex:none;display:flex;justify-content:center;padding-top:4px;background:#fff}
.home i{width:134px;height:5px;border-radius:3px;background:#111;opacity:.85}
.sms .row.sent .bubble{background:#34C759}
.sms .row.sent.last .bubble::after,.sms .row.sent.solo .bubble::after{background:radial-gradient(circle at 100% 0,transparent 67%,#34C759 68%)}
.sms .composer .plus{background:#34C759}
</style>
</head>
<body>
<div id="phone">
  <div class="status">
    <div class="time" id="statusTime">9:41 AM</div>
    <div class="icons" aria-hidden="true">
      <svg width="17" height="12" viewBox="0 0 17 12"><rect x="0" y="3.5" width="3" height="8.5" rx="0.8" fill="currentColor"/><rect x="4.5" y="2" width="3" height="10" rx="0.8" fill="currentColor"/><rect x="9" y="0.5" width="3" height="11.5" rx="0.8" fill="currentColor"/><rect x="13.5" y="0" width="3" height="12" rx="0.8" fill="currentColor" opacity=".35"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 3.2c1.8 0 3.4.7 4.6 1.8l1.2-1.3A8.2 8.2 0 0 0 8 1 8.2 8.2 0 0 0 2.2 3.7l1.2 1.3A6.4 6.4 0 0 1 8 3.2zm0 3.1c1 0 1.9.4 2.6 1l1.2-1.3A5.2 5.2 0 0 0 8 4.7 5.2 5.2 0 0 0 4.2 6l1.2 1.3A3.5 3.5 0 0 1 8 6.3zm0 3.2a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z" fill="currentColor"/></svg>
      <svg width="27" height="12" viewBox="0 0 27 12"><rect x="0" y="1" width="22" height="10" rx="2.2" stroke="currentColor" stroke-width="1.2" fill="none" opacity=".45"/><rect x="1.6" y="2.6" width="16" height="6.8" rx="1.2" fill="currentColor"/><rect x="23.2" y="3.8" width="2.2" height="4.4" rx="0.7" fill="currentColor" opacity=".45"/></svg>
    </div>
  </div>
  <header class="nav">
    <button class="back" type="button" aria-label="Back" onclick="history.length>1&&history.back()">
      <svg width="13" height="22" viewBox="0 0 13 22" fill="none"><path d="M11.5 1.5L2 11l9.5 9.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="who">
      <div class="av" id="avatar">M</div>
      <div class="nm"><span id="contactName">Mom</span><svg viewBox="0 0 7 11" fill="none"><path d="M1 1l4.5 4.5L1 10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    </div>
    <div></div>
  </header>
  <main class="thread" id="thread"></main>
  <div class="composer">
    <button class="plus" type="button" aria-label="Apps"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v12M1 7h12" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg></button>
    <div class="field"><span id="inputPh">iMessage</span>
      <svg class="mic" viewBox="0 0 24 24" fill="none"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z" stroke="currentColor" stroke-width="1.8"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </div>
  </div>
  <div class="home"><i></i></div>
</div>
<script id="payload" type="application/json">{}</script>
<script>
(function () {
  "use strict";
  var P = {};
  try { P = JSON.parse(document.getElementById("payload").textContent || "{}") || {}; } catch (e) { P = {}; }
  var contact = P.contact || {};
  var messages = Array.isArray(P.messages) ? P.messages : [];
  var name = contact.name || "Mom";
  var letters = String(contact.avatarLetters || name.charAt(0) || "?").slice(0, 2).toUpperCase();
  var top = contact.avatarHueA || "#A8A8AE";
  var bot = contact.avatarHueB || "#6E6E73";
  var service = String(contact.service || "iMessage").toLowerCase() === "sms" ? "sms" : "imessage";
  var showTyping = P.showTyping !== false;
  var readLabel = P.readLabel || contact.readLabel || "Read 9:41 AM";
  var showRead = P.showRead !== false;
  var statusTime = P.statusTime || contact.statusTime || "9:41 AM";

  document.title = name + " – Messages";
  document.getElementById("statusTime").textContent = statusTime;
  document.getElementById("contactName").textContent = name;
  var av = document.getElementById("avatar");
  av.textContent = letters;
  av.style.background = "linear-gradient(180deg," + top + " 0%," + bot + " 100%)";
  document.getElementById("inputPh").textContent = service === "sms" ? "Text Message" : "iMessage";
  if (service === "sms") document.getElementById("phone").classList.add("sms");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }
  function sideOf(m) {
    return m.side === "sent" || m.side === "you" ? "sent" : "recv";
  }

  var items = messages.filter(function (m) { return m && m.kind !== "typing"; });
  var html = "";
  var lastSentIndex = -1;
  items.forEach(function (m, i) {
    if (m.timestampLabel) html += '<div class="ts">' + esc(m.timestampLabel) + "</div>";
    if (m.kind === "timestamp" || !m.text) return;
    var side = sideOf(m);
    var prev = items[i - 1];
    var next = items[i + 1];
    var prevSame = prev && prev.kind !== "timestamp" && prev.text && sideOf(prev) === side && !m.timestampLabel;
    // break grouping when this message starts a new time header
    if (m.timestampLabel) prevSame = false;
    var nextSame = next && next.kind !== "timestamp" && next.text && sideOf(next) === side && !next.timestampLabel;
    var role = !prevSame && !nextSame ? "solo" : !prevSame && nextSame ? "first" : prevSame && nextSame ? "mid" : "last";
    html += '<div class="row ' + side + " " + role + '"><div class="bubble">' + esc(m.text) + "</div></div>";
    if (side === "sent") lastSentIndex = i;
  });

  // Place read receipt after the last sent bubble in the final sent run
  if (showRead && lastSentIndex >= 0) {
    var rebuilt = "";
    var pos = 0;
    items.forEach(function (m, i) {
      if (m.timestampLabel) { rebuilt += '<div class="ts">' + esc(m.timestampLabel) + "</div>"; }
      if (m.kind === "timestamp" || !m.text) return;
      var side = sideOf(m);
      var prev = items[i - 1];
      var next = items[i + 1];
      var prevSame = prev && prev.kind !== "timestamp" && prev.text && sideOf(prev) === side && !m.timestampLabel;
      if (m.timestampLabel) prevSame = false;
      var nextSame = next && next.kind !== "timestamp" && next.text && sideOf(next) === side && !next.timestampLabel;
      var role = !prevSame && !nextSame ? "solo" : !prevSame && nextSame ? "first" : prevSame && nextSame ? "mid" : "last";
      rebuilt += '<div class="row ' + side + " " + role + '"><div class="bubble">' + esc(m.text) + "</div></div>";
      if (i === lastSentIndex) rebuilt += '<div class="meta">' + esc(readLabel) + "</div>";
      pos++;
    });
    html = rebuilt;
  }

  if (showTyping) {
    html += '<div class="row recv"><div class="typing" aria-label="Typing"><i></i><i></i><i></i></div></div>';
  }
  var thread = document.getElementById("thread");
  thread.innerHTML = html;
  requestAnimationFrame(function () { thread.scrollTop = thread.scrollHeight; });
})();
</script>
</body>
</html>
